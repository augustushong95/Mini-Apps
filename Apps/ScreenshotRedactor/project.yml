name: ScreenshotRedactor

include:
  - path: ../../Configs/MenuBarApp.yml
    relativePaths: false

targets:
  ScreenshotRedactor:
    templates: [MenuBarApp]
    settings:
      base:
        PRODUCT_NAME: Screenshot Redactor
        PRODUCT_MODULE_NAME: ScreenshotRedactor
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Productivity is the template's category, which suits this app.
    scheme:
      testTargets:
        - ScreenshotRedactorTests
      # Local StoreKit testing for the Pro purchase (Xcode's Run action).
      storeKitConfiguration: ScreenshotRedactor.storekit

  ScreenshotRedactorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      # StoreKitTest reads the purchase configuration from the test bundle.
      - path: ScreenshotRedactor.storekit
        buildPhase: resources
    dependencies:
      - target: ScreenshotRedactor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ScreenshotRedactorTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Screenshot Redactor.app/Contents/MacOS/Screenshot Redactor"
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
