name: PosturePet

include:
  - path: ../../Configs/MenuBarApp.yml
    relativePaths: false

targets:
  PosturePet:
    templates: [MenuBarApp]
    settings:
      base:
        PRODUCT_NAME: Posture Pet
        PRODUCT_MODULE_NAME: PosturePet
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        # Required by CMHeadphoneMotionManager; the app crashes without it.
        INFOPLIST_KEY_NSMotionUsageDescription: "Posture Pet reads your AirPods' head tilt to see how you're sitting and to steer games. Motion data stays on this Mac and is never saved."
    scheme:
      testTargets:
        - PosturePetTests
      # Local StoreKit testing for the Pro purchase (Xcode's Run action).
      storeKitConfiguration: PosturePet.storekit

  PosturePetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      # StoreKitTest reads the purchase configuration from the test bundle.
      - path: PosturePet.storekit
        buildPhase: resources
    dependencies:
      - target: PosturePet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).PosturePetTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Posture Pet.app/Contents/MacOS/Posture Pet"
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
